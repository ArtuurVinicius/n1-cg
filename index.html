<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Animações Computação Gráfica</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        
        #canvas {
            display: block;
            width: 100vw;
            height: 600px;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100vw;
            margin-top: 10px;
        }
        
        #currentAnimation {
            flex: 1;
            text-align: center;
            font-weight: bold;
        }
        
        #prevBtn,
        #nextBtn {
            min-width: 150px;
        }
        
        #matrixContainer {
            text-align: center;
            margin: 20px;
        }
        
        #matrixContainer table {
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: 20px auto;
        }
        
        #matrixContainer td {
            min-width: 80px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.11.0/lib/browser/math.js"></script>
</head>

<body>
    <canvas id="canvas" height="600"></canvas>
    <div id="matrixContainer"></div>
    <div class="controls">
        <button id="prevBtn">Animação anterior</button>
        <span id="currentAnimation"></span>
        <button id="nextBtn">Próxima animação</button>
    </div>

    <script>
        function resizeCanvas() {
            const canvas = document.getElementById('canvas');
            canvas.width = window.innerWidth;
        }

        window.addEventListener('resize', resizeCanvas);

        const animations = [
            'questoes/1-a.js',
            'questoes/1-b.js',
            'questoes/1-c.js',
            'questoes/1-simulacao.js'

        ];
        let current = 0;
        let currentScript = null;
        let animationStopper = null;

        function updateCurrentAnimationLabel() {
            const label = document.getElementById('currentAnimation');
            const fileName = animations[current].split('/').pop();
            label.textContent = fileName;
        }

        function removeCanvasAndCreateNew() {
            const oldCanvas = document.getElementById('canvas');
            if (oldCanvas) oldCanvas.remove();
            const newCanvas = document.createElement('canvas');
            newCanvas.id = 'canvas';
            newCanvas.height = 600;
            document.body.insertBefore(newCanvas, document.body.firstChild);
            resizeCanvas();
            return newCanvas;
        }

        function loadAnimation(index) {
            // Remove canvas and create a new one to clear context and stop old animations
            const canvas = removeCanvasAndCreateNew();

            // Mostrar ou ocultar matrixContainer conforme a animação
            const matrixContainer = document.getElementById('matrixContainer');
            if (animations[index] === 'questoes/1-c.js') {
                matrixContainer.style.display = '';
            } else {
                matrixContainer.style.display = 'none';
            }

            // Remove previous script if exists
            if (currentScript) {
                currentScript.remove();
                currentScript = null;
            }

            // Remove previous animation stopper if exists
            if (typeof window.stopAnimation === 'function') {
                window.stopAnimation();
                window.stopAnimation = undefined;
            }

            // Remove previous startAnimation
            window.startAnimation = undefined;

            // Load new script
            const script = document.createElement('script');
            script.src = animations[index];
            script.onload = () => {
                if (typeof window.startAnimation === 'function') {
                    window.startAnimation(canvas);
                }
            };
            document.body.appendChild(script);
            currentScript = script;
            updateCurrentAnimationLabel();
        }

        document.getElementById('nextBtn').onclick = function() {
            current = (current + 1) % animations.length;
            loadAnimation(current);
        };

        document.getElementById('prevBtn').onclick = function() {
            current = (current - 1 + animations.length) % animations.length;
            loadAnimation(current);
        };

        // Inicialização
        loadAnimation(current);
        window.addEventListener('resize', resizeCanvas);
    </script>

    <footer style="text-align: center; margin-top: 20px;">As matrizes geradas estão disponíveis no console</footer>
</body>

</html>
